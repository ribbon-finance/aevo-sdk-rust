[package]
name = "aevo-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Official Rust SDK for Aevo"
repository = "https://github.com/ribbon-finance/aevo-sdk-rust"

[dependencies]
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2"
ethers-core = "2"
ethers-signers = "2"

[dev-dependencies]
wiremock = "0.6"
